[package]
name = "hello-world"
version = "0.1.0"
authors = ["Ramiro Berrelleza <rberrelleza@gmail.com>"]
edition = "2024"

[[bin]]
name = "hello-world"
path = "src/main.rs"

[dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
