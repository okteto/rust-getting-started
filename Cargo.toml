[package]
name = "hello-world"
version = "0.1.0"
authors = ["Ramiro Berrelleza <rberrelleza@gmail.com>"]
edition = "2024"

[[bin]]
name = "hello-world"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
